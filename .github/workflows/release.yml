name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          cache: true

      - name: Make script executable
        run: chmod +x .scripts/bash/build

      - name: Build
        run: .scripts/bash/build

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: ${{ env.MCPACK_FILE }}
          generate_release_notes: true
